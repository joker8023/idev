[package]
name = "multica-tauri"
version = "0.1.0"
description = "Multica rewritten in Rust + Tauri — local-only, no cloud. Frontend (React) preserved, Go backend replaced by Rust."
authors = ["Kai"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
chrono-tz = "0.10"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
